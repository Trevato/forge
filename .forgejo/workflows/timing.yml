name: timing
# Nightly: the wall-clock budgets (#7789). No check the forge runs, a pull's or
# the merge queue's gate, enforces them: it only warns of a time
# over its budget (test/helpers/budget.ts); here, one test file at a time on an
# otherwise idle runner, each budget is held to its absolute ms. A newly red
# file opens one `Red: test/….test.ts` issue and a green one closes it, as
# outside-gate does (scripts/flake-hunt.ts timing). Needs secret FORGE_TOKEN and
# variable FORGE_URL.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

jobs:
  timing:
    runs-on: isolated
    timeout-minutes: 30
    env:
      REGISTRY: forgejo-http.forgejo.svc.cluster.local:3000
      FORGE_TEST_TIMING: "1"
      FORGE_TEST_QUIET: "1"
    steps:
      - name: clone main
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone -q "http://x-access-token:$TOKEN@$REGISTRY/$GITHUB_REPOSITORY.git" src
          cd src
          bun install --frozen-lockfile

      - name: budget tests, serially
        working-directory: src
        env:
          FORGE_API: ${{ vars.FORGE_URL }}/api/v1
          FORGE_REPO: ${{ github.repository }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          FORGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: bun scripts/flake-hunt.ts timing --file-issues
