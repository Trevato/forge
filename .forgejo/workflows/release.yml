name: release
# A version tag ships: wait for the forge's own check of the tagged commit,
# build the image from the Dockerfile (which boots what it built), sign it,
# push the chart. Flux rolls the new chart version to prod once the platform
# pins it. This is the release's one gate (#2794); docs/ops/ROLL.md says the rest.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    # The droplet runner: it pushes to the registry beside it. A build on the
    # vxrail pushes the image across the home uplink and dies at the registry
    # (499, 2026-10-15), so image builds never run there.
    runs-on: droplet
    env:
      # In-cluster http registry — helm chart push + cosign signature write.
      REGISTRY: forgejo-http.forgejo.svc.cluster.local:3000
    steps:
      - name: derive owner + app + version + endpoints
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          OWNER="${GITHUB_REPOSITORY%%/*}"; APP="${GITHUB_REPOSITORY##*/}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "APP=$APP"     >> $GITHUB_ENV
          echo "V=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          # Images push to the platform's public registry base (git.<domain>),
          # derived from the repo's html_url; the runner's own server url is
          # the internal http endpoint, which buildkit cannot push to.
          BASE=$(curl -fsS -H "Authorization: token $TOKEN" \
            "http://$REGISTRY/api/v1/repos/$OWNER/$APP" \
            | sed -n "s#.*\"html_url\":\"\(https\{0,1\}://[^\"/]*\)/$OWNER/$APP\".*#\1#p")
          [ -n "$BASE" ] || { echo "FATAL: could not derive public registry base"; exit 1; }
          REG_PUB=$(printf '%s' "$BASE" | sed -E 's#^https?://##; s#/$##')
          echo "REG_PUB=$REG_PUB" >> $GITHUB_ENV
          echo "public registry: $REG_PUB"

      - name: write registry auth
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "$OWNER" "$TOKEN" | base64 -w0 2>/dev/null || printf '%s:%s' "$OWNER" "$TOKEN" | base64 | tr -d '\n')
          cat > ~/.docker/config.json <<JSON
          {"auths":{"$REG_PUB":{"auth":"$AUTH"},"$REGISTRY":{"auth":"$AUTH"}}}
          JSON

      - name: clone source at tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://x-access-token:$TOKEN@$REGISTRY/$OWNER/$APP.git" src

      # The gate of record (#2794), half one: the forge's own full check —
      # the one every push to main runs — green on this very commit. Nothing
      # on this runner re-runs the suite: its copy held four good releases on
      # runner-only reds and caught none of the real failures. Half two is
      # the build below: the Dockerfile boots the image it built
      # (src/release/boot.ts) and fails the build if it does not answer.
      # Reads the two settings the flake hunt already needs on the mirror:
      # variable FORGE_URL (the forge's origin) and secret FORGE_TOKEN.
      - name: the forge's own check is green on this commit
        env:
          FORGE_URL: ${{ vars.FORGE_URL }}
          FORGE_REPO: ${{ vars.FORGE_REPO }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -eu
          [ -n "${FORGE_URL:-}" ] || { echo "FATAL: variable FORGE_URL is not set on the mirror"; exit 1; }
          URL="${FORGE_URL%/}"
          # The forge names the repository its own way (trevato/forge), not as the mirror does (trevato-apps/forge).
          REPO="${FORGE_REPO:-$OWNER/$APP}"
          SHA=$(git -C src rev-parse HEAD)
          # Bootstrapping: a live forge older than this route answers no_route. Then
          # there is nothing to ask; the build's own boot proof still guards the image.
          if curl -sS "$URL/api/v1/repos/$REPO/commits/$SHA/check" | grep -q '"error":"no_route"'; then
            echo "warning: the live forge has no commit-check route yet (older release); relying on the boot proof"; exit 0
          fi
          read_check() {
            if [ -n "${FORGE_TOKEN:-}" ]; then
              curl -fsS -H "authorization: Bearer $FORGE_TOKEN" "$URL/api/v1/repos/$REPO/commits/$SHA/check"
            else
              curl -fsS "$URL/api/v1/repos/$REPO/commits/$SHA/check"
            fi
          }
          # main's check takes minutes; the tag can be cut before it ends.
          # A landing pushes the answer on to a newer commit, so in a busy hour this could wait for ever: five
          # minutes, then the landing gate, verify-after on main and the boot proof stand. A push to main queues
          # its check at once, so a commit still unchecked after ten minutes
          # was never main's: that is not worth the two hours.
          START=$(date +%s)
          DEADLINE=$(( START + 300 ))
          while :; do
            BODY=$(read_check || echo '{"state":"unreachable"}')
            STATE=$(printf '%s' "$BODY" | sed -n 's/.*"state":"\([a-z]*\)".*/\1/p')
            case "$STATE" in
              ok) echo "$REPO@$SHA: $(printf '%s' "$BODY" | sed -n 's/.*"summary":"\([^"]*\)".*/\1/p')"; exit 0 ;;
              failed) echo "FATAL: the forge's own check failed on $SHA: $URL/$REPO/runs/$(printf '%s' "$BODY" | sed -n 's/.*"runId":"\([^"]*\)".*/\1/p')"; exit 1 ;;
              # A landing right after the cut cancels main's check of the tag. The commit passed its own landing gate,
              # and verify-after runs the whole suite on main, so a busy hour must not hold a release.
              superseded) echo "warning: main's check of $SHA was superseded by a later landing; relying on the landing gate and the boot proof"; exit 0 ;;
              none) [ $(( $(date +%s) - START )) -lt 600 ] || { echo "FATAL: main never checked $SHA in 10 min; tag a commit on main"; exit 1; } ;;
            esac
            [ "$(date +%s)" -lt "$DEADLINE" ] || { echo "warning: no answer on $SHA in 5 min (last: ${STATE:-unreadable}); relying on the landing gate, verify-after and the boot proof"; exit 0; }
            echo "waiting: the forge's check of $SHA is ${STATE:-unreadable}"
            sleep 30
          done

      - name: build & push image (rootless buildkit)
        run: |
          set -eu
          buildctl --addr "$BUILDKIT_HOST" build \
            --frontend dockerfile.v0 \
            --local context=src --local dockerfile=src \
            --opt build-arg:VERSION="$V" \
            --opt build-arg:COMMIT="$(git -C src rev-parse HEAD)" \
            --output type=image,name=$REG_PUB/$OWNER/$APP:$V,push=true \
            --metadata-file /tmp/md.json
          DIGEST=$(grep -o '"containerimage.digest":[^,]*' /tmp/md.json | grep -o 'sha256:[a-f0-9]\{64\}' | head -1)
          [ -n "$DIGEST" ] || { echo "FATAL: no pushed digest"; exit 1; }
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "pushed $REG_PUB/$OWNER/$APP:$V @ $DIGEST"

      - name: sign image (cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "cosign key not provisioned; skipping signing"
            exit 0
          fi
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$REG_PUB/$OWNER/$APP@$DIGEST"

      - name: package & push helm chart
        working-directory: src
        run: |
          set -eu
          sed -i "s/^name:.*/name: $APP/" charts/app/Chart.yaml
          helm package charts/app --version "$V" --app-version "$V"
          helm push "$APP-$V.tgz" "oci://$REGISTRY/$OWNER/charts" --plain-http
