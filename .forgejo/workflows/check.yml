name: check
# The gate: the check forge.json declares — zero type errors and a green
# suite — on every push to main and every pull request, before release.yml
# ever builds an image. Runs on the
# platform's isolated, unprivileged runner pool (host mode: bun + git baked
# in, no docker daemon).
#
# Typecheck (tsc --noEmit) is intentionally NOT run on this isolated Actions
# runner. Empirically (#386/#388/#390/#392) full-project tsc SIGKILLs after
# ~17m thrash (exit 137) at --max-old-space-size=1024 or 1536: the isolated
# Actions cgroup is too small. Locally the same tsc finishes in ~12s with
# peak RSS ~772 MiB at heap 1024. forge.json check.limits.memory: 4096
# applies to forge check cells, NOT to Actions runs-on: isolated — so keep
# `node … tsc --noEmit &&` in forge.json check.run for forge-side cells and
# do not duplicate typecheck here. This workflow only runs the gate half.
#
# The serial SHARDS=1 gate is ~32–50m wall clock. The isolated runner silently
# cuts a single job at ~30m (pod/runner wall), so timeout-minutes: 120 does
# not help. Split the gate across matrix jobs via --shard N/M; each cell
# still runs FORGE_CHECK_SHARDS=1 (one bun test at a time — do not reintroduce
# parallel bun in one container; that OOMed on #386). A final `check` job
# aggregates the matrix so the required status stays `check / check (…)`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: isolated
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 174 gate files → ~58 each; ~11–17m expected, under the ~30m runner wall.
        shard: [1, 2, 3]
    env:
      REGISTRY: forgejo-http.forgejo.svc.cluster.local:3000
      # Do not set NODE_OPTIONS job-wide: a big heap lets Node claim the
      # cgroup and the kernel OOMs (`Killed`, exit 137). Typecheck lives in
      # forge.json check.run (4Gi forge cells), not on this runner.
      FORGE_CHECK_SHARD_TOTAL: "3"
    steps:
      - name: derive owner + app
        run: |
          set -eu
          echo "OWNER=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "APP=${GITHUB_REPOSITORY##*/}"   >> "$GITHUB_ENV"

      - name: clone source at this ref
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone "http://x-access-token:$TOKEN@$REGISTRY/$OWNER/$APP.git" src
          cd src
          git checkout -q "$GITHUB_SHA"
          echo "checked out $(git rev-parse --short HEAD)"

      - name: runner limits (observability only)
        run: |
          # Print the real budget this job runs under. Never fails the job.
          set +e
          cg=/sys/fs/cgroup
          rd() { [ -r "$1" ] && echo "$2=$(cat "$1")" >&2; }
          echo "runner-limits: nproc=$(nproc) host_mem_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)" >&2
          rd $cg/memory.max memory.max; rd $cg/memory.high memory.high
          rd $cg/memory.swap.max memory.swap.max; rd $cg/cpu.max cpu.max
          rd $cg/memory/memory.limit_in_bytes v1.memory.limit
          rd $cg/cpu/cpu.cfs_quota_us v1.cpu.quota; rd $cg/cpu/cpu.cfs_period_us v1.cpu.period
          echo "runner-limits: bun=$(bun --version) node=$(node --version) git=$(git --version)" >&2
          echo "runner-limits: v8_heap_limit_mb=$(node -e 'console.log(Math.round(require("v8").getHeapStatistics().heap_size_limit/2**20))')" >&2
          true

      - name: install dev dependencies
        working-directory: src
        run: bun install --frozen-lockfile

      # Gate slice only — typecheck skipped on isolated Actions (see header).
      # forge.json check.run still runs tsc on forge check cells (4Gi).
      - name: gate shard ${{ matrix.shard }}/3
        working-directory: src
        env:
          FORGE_CHECK_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -eu
          # Observability: a stderr heartbeat every 60s with elapsed time and
          # cgroup memory (current/peak), a warning at 25m before the ~30m
          # runner wall, and one CI_SUMMARY JSON line at exit. Read-only.
          T0=$(date +%s)
          memof() { cat /sys/fs/cgroup/$1 2>/dev/null || echo -1; }
          ( while sleep 60; do
              el=$(( $(date +%s) - T0 ))
              echo "heartbeat: shard=${{ matrix.shard }}/3 elapsed_s=$el mem_current=$(memof memory.current) mem_peak=$(memof memory.peak)" >&2
              if [ "$el" -ge 1500 ] && [ "$el" -lt 1560 ]; then
                echo "::warning::gate shard ${{ matrix.shard }} at ${el}s — the isolated runner cuts jobs near 1800s" >&2
              fi
            done ) &
          HB=$!
          summary() {
            rc=$?; kill "$HB" 2>/dev/null || true
            echo "CI_SUMMARY {\"phase\":\"gate\",\"shard\":\"${{ matrix.shard }}/3\",\"event\":\"$GITHUB_EVENT_NAME\",\"exit\":$rc,\"wall_s\":$(( $(date +%s) - T0 )),\"mem_peak\":$(memof memory.peak),\"mem_max\":\"$(memof memory.max)\"}" >&2
          }
          trap summary EXIT
          # A pull judges the fast tier (#1198); main's push runs the whole gate.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$GITHUB_BASE_REF"
            echo "$ bun scripts/test-shards.ts --timeout 60000 --tier fast --diff origin/$GITHUB_BASE_REF..HEAD"
            FORGE_CHECK_SHARDS=1 bun scripts/test-shards.ts --timeout 60000 --tier fast --diff "origin/$GITHUB_BASE_REF..HEAD" --shard ${{ matrix.shard }}/3
            exit $?
          fi
          echo "$ FORGE_CHECK_SHARDS=1 bun scripts/test-shards.ts --timeout 60000 --gate --shard ${{ matrix.shard }}/3"
          # stderr for start lines: Actions often fully-buffers piped stdout
          # until process exit, which an OOM never reaches.
          FORGE_CHECK_SHARDS=1 bun scripts/test-shards.ts --timeout 60000 --gate --shard ${{ matrix.shard }}/3

  # Required PR status is `check / check (pull_request)`. Matrix cells report
  # as `check / gate (N, …)`; this job restores the top-level `check` name.
  check:
    runs-on: isolated
    needs: [gate]
    if: always()
    timeout-minutes: 10
    steps:
      - name: require every gate shard green
        run: |
          set -eu
          echo "gate result: ${{ needs.gate.result }}"
          test "${{ needs.gate.result }}" = "success"
