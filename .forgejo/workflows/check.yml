name: check
# The gate: the check forge.json declares — zero type errors and a green
# suite — on every push to main and every pull request, before release.yml
# ever builds an image. Runs on the
# platform's isolated, unprivileged runner pool (host mode: bun + git baked
# in, no docker daemon).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: isolated
    env:
      REGISTRY: forgejo-http.forgejo.svc.cluster.local:3000
      # Do not set NODE_OPTIONS job-wide: a big heap lets Node claim the
      # cgroup and the kernel OOMs (`Killed`, exit 137). Heap is scoped to
      # the typecheck step via `node --max-old-space-size=…` only.
    steps:
      - name: derive owner + app
        run: |
          set -eu
          echo "OWNER=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "APP=${GITHUB_REPOSITORY##*/}"   >> "$GITHUB_ENV"

      - name: clone source at this ref
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone "http://x-access-token:$TOKEN@$REGISTRY/$OWNER/$APP.git" src
          cd src
          git checkout -q "$GITHUB_SHA"
          echo "checked out $(git rev-parse --short HEAD)"

      - name: install dev dependencies (types + tsc)
        working-directory: src
        run: bun install --frozen-lockfile

      # Split the forge.json check.run halves into two steps so a cgroup
      # SIGKILL shows which side died (typecheck vs gate), instead of one
      # silent 17m `sh -c` with no breadcrumbs (#386/#388/#390).
      - name: typecheck (forge.json check.run, first half)
        working-directory: src
        run: |
          set -eu
          echo "$ node --max-old-space-size=1024 ./node_modules/typescript/lib/tsc.js --noEmit"
          node --max-old-space-size=1024 ./node_modules/typescript/lib/tsc.js --noEmit
          echo "typecheck ok"

      - name: gate (forge.json check.run, second half)
        working-directory: src
        run: |
          set -eu
          echo "$ FORGE_CHECK_SHARDS=1 bun scripts/test-shards.ts --timeout 60000 --gate"
          # stderr for start lines: Actions often fully-buffers piped stdout
          # until process exit, which an OOM never reaches.
          FORGE_CHECK_SHARDS=1 bun scripts/test-shards.ts --timeout 60000 --gate
