apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
    role: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: ssh
      port: {{ .Values.forge.sshPort }}
      targetPort: ssh
