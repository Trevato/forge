apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # A release does not drop a session. The new pod comes up beside the old
    # one (both on the volume's node — local-path storage is node-bound, so
    # ReadWriteOnce still holds), takes everything new once ready, and the
    # old one drains: it stops its crew, apps and checks, fails readiness,
    # and keeps serving whoever is connected over SSH until they leave, up to
    # the grace period below. SQLite in WAL mode carries two processes for
    # that window; run leases keep the new pod from mistaking the old pod's
    # live work for a crash's leftovers.
    plat.sh/rollout: surge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        role: web
      annotations:
        plat.sh/user-env-rev: {{ .Values.userEnvRev | default "init" | quote }}
    spec:
      # The crew, checks and merge-queue gates under way get ten seconds
      # (FORGE_CREW_DRAIN_S, FORGE_CHECKS_DRAIN_S), then are handed back
      # queued to resume on the next pod: the old pod stops writing at once,
      # so the new one's queue work waits seconds, not minutes (#7799). The
      # long grace stays for SSH sessions that are still connected.
      terminationGracePeriodSeconds: 720
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # PodSecurity `restricted`. The image runs as uid 1000 (`bun`); fsGroup
      # makes the volume writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Set the volume's owner once, on first mount, and then leave it: the
        # default rewrites every file's mode on every start, which turns the
        # forge's 0600 secret key into 0660 and the forge refuses it.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 8080
            {{- if include "forge.ssh" . }}
            - name: ssh
              containerPort: 2222
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: FORGE_DATA
              value: /data
            # 8080 is the port the platform's edge policy admits; the
            # generated ingress rule names it, so the forge listens there.
            - name: PORT
              value: "8080"
            - name: FORGE_URL
              value: {{ include "forge.url" . | quote }}
            # Apps hang off the forge's own host as single labels
            # (`notes--<forge host>`), the only shape the platform's wildcard
            # DNS and certificate cover; the IngressRoute below routes them.
            - name: FORGE_APP_DOMAIN
              value: {{ printf "--%s" (include "forge.host" .) | quote }}
            # The platform edge signs people in and vouches for them with this
            # secret; the forge trusts its identity headers only alongside it.
            - name: FORGE_EDGE_NAME
              value: {{ .Values.forge.edgeName | default "open-platform.sh" | quote }}
            - name: FORGE_EDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plat-edge-token
                  key: token
                  optional: true
            # Inside the cluster the platform's own hosts answer with its
            # private CA; trusting it lets this forge talk to them (origins).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/plat-ca/tls.crt
            - name: FORGE_CREW_CONCURRENCY
              value: {{ .Values.forge.crewConcurrency | quote }}
            - name: FORGE_APPS_CONCURRENCY
              value: {{ .Values.forge.appsConcurrency | quote }}
            {{- with .Values.forge.originClients }}
            # Origins the operator registered once, for everyone.
            - name: FORGE_ORIGIN_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.forge.trustedProxies }}
            # The proxies allowed to say who the client is (README, Signup).
            - name: FORGE_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.forge.clientIpHeader }}
            # The header a listed proxy names the client in, if not X-Forwarded-For.
            - name: FORGE_CLIENT_IP_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- if include "forge.ssh" . }}
            - name: FORGE_SSH_PORT
              value: {{ .Values.forge.sshPort | quote }}
            - name: FORGE_HOST
              value: {{ .Values.forge.sshHost | quote }}
            {{- else }}
            # A preview is web-only: the edge's SSH entrypoint belongs to prod.
            - name: FORGE_SSH_PORT
              value: "0"
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plat-ca
              mountPath: /etc/plat-ca
              readOnly: true
            - name: forge-guard
              mountPath: /etc/forge-guard
              readOnly: true
          # `/` answers 200 for anyone; it is the landing page. Boot reconciles
          # the index from git first, which grows with the number of repos.
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 60
          # Readiness is the forge's own word: 503 once it is draining. It
          # only routes, so it may stay quick.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          # Liveness asks only "is the process up and does its database
          # open", and tolerates a minute and a half of slowness: a busy
          # forge (a check, four runs, a restore drill on the host) is not a
          # dead one, and a restart re-queues every run it holds (#1221).
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: plat-ca
          secret:
            secretName: plat-local-ca-tls
        # The watchdog's view of the platform; absent is fine.
        - name: forge-guard
          configMap:
            name: forge-guard
            optional: true
            optional: true
